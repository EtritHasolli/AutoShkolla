name: Release app

# Every push to main publishes a GitHub Release (no secrets needed):
#   AutoShkolla.apk  the signed APK committed in apk/ (built locally with
#                    `npm run android:apk` — the signing key never leaves the PC)
#   bundle.zip       the web app built from this commit
#   update.json      what installed apps read on launch (src/lib/updater.js)
# Web-only changes reach phones as a live update, no reinstall. If native code
# changed (android/, capacitor.config.json, a Capacitor plugin) and apk/ wasn't
# rebuilt, this fails and tells you to run `npm run android:apk`.
# Put [skip ci] in a commit message to push without releasing.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'supabase/**'
      - '.claude/**'
      - '.github/workflows/keep-supabase-awake.yml'
      - 'scripts/keepalive.mjs'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history, for the orphaned-release check below

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Plan release
        id: plan
        run: node scripts/release-plan.mjs
        env:
          RUN_NUMBER: ${{ github.run_number }}

      # Supabase URL + anon key come from the committed .env.production.
      - name: Build web bundle
        run: |
          npx vite build
          (cd dist && zip -qr ../out/bundle.zip .)
        env:
          APP_VERSION: ${{ steps.plan.outputs.version }}

      - name: Publish release
        run: |
          TAG="${{ steps.plan.outputs.tag }}"
          cp apk/AutoShkolla.apk out/AutoShkolla.apk
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true   # only on a re-run
          gh release create "$TAG" out/AutoShkolla.apk out/bundle.zip out/update.json \
            --target "$GITHUB_SHA" --latest \
            --title "AutoShkolla $TAG" --notes-file out/notes.md

      - name: Keep the 10 newest releases
        continue-on-error: true
        run: gh release list --limit 100 --json tagName --jq '.[10:][].tagName' | xargs -r -n1 gh release delete --cleanup-tag --yes

      # After a history rewrite (e.g. removing something from git history), old
      # releases still point at the old commits and ship their files. Delete any
      # release whose commit is neither an ancestor nor a descendant of this one.
      - name: Drop releases from rewritten history
        continue-on-error: true
        run: |
          git fetch --force --tags origin
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null || continue
            if ! git merge-base --is-ancestor "$tag" HEAD && ! git merge-base --is-ancestor HEAD "$tag"; then
              echo "Deleting $tag (not in this branch's history)"
              gh release delete "$tag" --cleanup-tag --yes
            fi
          done
